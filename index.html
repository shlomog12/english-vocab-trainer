<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת נגינה ברקע</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;margin:0;padding:16px;background:#12141b;color:#eceef5;line-height:1.5}
  h1{font-size:20px;margin:0 0 4px}
  p{color:#9aa1b2;font-size:14px;margin:4px 0 12px}
  .box{background:#1c1f2a;border:1px solid #2c3040;border-radius:14px;padding:14px;margin-bottom:14px}
  button{font:inherit;font-size:16px;padding:12px 18px;border-radius:12px;border:0;background:#4f46e5;color:#fff;margin:4px 4px 4px 0}
  button.alt{background:#2c3040}
  #log{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;direction:ltr;text-align:left;max-height:260px;overflow:auto}
  #clock{font-size:28px;font-weight:700;direction:ltr;text-align:center}
</style>
</head>
<body>
<h1>🎧 בדיקת נגינה ברקע</h1>
<p>לחץ נגן, נעל את המסך או מזער את הדפדפן, חכה דקה-שתיים, וחזור. הלוג למטה יראה אם הנגינה המשיכה.</p>

<div class="box">
  <b>בדיקה A: &lt;audio&gt; אמיתי (צפצוף כל 5 שניות)</b>
  <div id="clock">0:00</div>
  <button id="playA">▶ נגן A</button>
  <button id="stopA" class="alt">⏹ עצור</button>
</div>

<div class="box">
  <b>בדיקה B: הקראה (speechSynthesis) סופרת מספרים</b>
  <p>זו השיטה שבה האפליקציה משתמשת היום. להשוואה.</p>
  <button id="playB">▶ נגן B</button>
  <button id="stopB" class="alt">⏹ עצור</button>
</div>

<div class="box">
  <b>לוג</b>
  <div id="log"></div>
</div>

<audio id="aud" loop playsinline></audio>

<script>
(function(){
  var logEl=document.getElementById("log"),clock=document.getElementById("clock"),aud=document.getElementById("aud");
  function log(m){var t=new Date().toLocaleTimeString("he-IL");logEl.textContent=t+"  "+m+"\n"+logEl.textContent}

  // ---- build a WAV blob: 5 minutes, 8kHz mono, a 0.3s beep every 5s (pitch rises each beep) ----
  function makeWav(){
    var rate=8000,secs=300,n=rate*secs,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
    function s(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))}
    s(0,"RIFF");v.setUint32(4,36+n*2,true);s(8,"WAVE");s(12,"fmt ");v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);
    v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,"data");v.setUint32(40,n*2,true);
    for(var i=0;i<n;i++){
      var sec=i/rate,inBeep=(sec%5)<0.3,x=0;
      if(inBeep){var k=Math.floor(sec/5)%6;var f=440+k*110;var env=Math.min(1,(sec%5)*30,(0.3-(sec%5))*30);x=Math.sin(2*Math.PI*f*sec)*0.5*env}
      v.setInt16(44+i*2,x*32767,true);
    }
    return new Blob([buf],{type:"audio/wav"});
  }

  var url=null;
  function setupMedia(){
    if(!("mediaSession" in navigator))return;
    navigator.mediaSession.metadata=new MediaMetadata({title:"בדיקת רקע",artist:"english-vocab-trainer"});
    navigator.mediaSession.setActionHandler("play",function(){aud.play()});
    navigator.mediaSession.setActionHandler("pause",function(){aud.pause()});
  }
  function fmt(t){t=Math.floor(t);return Math.floor(t/60)+":"+("0"+t%60).slice(-2)}

  document.getElementById("playA").onclick=function(){
    if(!url){url=URL.createObjectURL(makeWav());aud.src=url}
    setupMedia();
    aud.play().then(function(){log("A: התחיל לנגן")},function(e){log("A: שגיאה "+e.message)});
  };
  document.getElementById("stopA").onclick=function(){aud.pause();aud.currentTime=0;log("A: נעצר")};
  aud.addEventListener("timeupdate",function(){clock.textContent=fmt(aud.currentTime)});
  aud.addEventListener("pause",function(){log("A: pause event (t="+fmt(aud.currentTime)+")")});
  aud.addEventListener("play",function(){log("A: play event")});

  // ---- test B: speech synthesis counter ----
  var bOn=false,bN=0,bTimer=null;
  function sayNext(){
    if(!bOn)return;
    bN++;
    try{var u=new SpeechSynthesisUtterance(String(bN));u.lang="en-US";speechSynthesis.speak(u);log("B: אמר "+bN)}catch(e){log("B: שגיאה")}
    bTimer=setTimeout(sayNext,5000);
  }
  document.getElementById("playB").onclick=function(){bOn=true;bN=0;log("B: התחיל");sayNext()};
  document.getElementById("stopB").onclick=function(){bOn=false;clearTimeout(bTimer);try{speechSynthesis.cancel()}catch(e){};log("B: נעצר")};

  // ---- visibility: show whether audio advanced while hidden ----
  var hiddenAt=null,tAtHide=0;
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){hiddenAt=Date.now();tAtHide=aud.currentTime;log("הדף ירד לרקע")}
    else if(hiddenAt){
      var wall=(Date.now()-hiddenAt)/1000,adv=aud.currentTime-tAtHide;
      if(adv<0)adv+=300;
      log("חזרה: עברו "+wall.toFixed(0)+" שנ', אודיו התקדם "+adv.toFixed(0)+" שנ' "+(aud.paused?"(מושהה!)":(adv>wall*0.8?"✅ המשיך ברקע":"❌ לא המשיך")));
      hiddenAt=null;
    }
  });
  log("מוכן");
})();
</script>
</body>
</html>
